[build]
publish = "."
command = "echo 'No build step needed - static files only'"

[[redirects]]
from = "/api/*"
to = "https://TABOOST_BACKEND_URL/api/:splat"
status = 200
force = true

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
